plugins { id 'com.android.application' }
def tenoSigning = new Properties()
def tenoSigningFile = new File(System.getProperty('user.home'), '.android/teno-signing.properties')
if (tenoSigningFile.exists()) tenoSigningFile.withInputStream { tenoSigning.load(it) }
android {
    namespace 'com.teno.app'
    compileSdk 36
    defaultConfig {
        applicationId project.findProperty('verificationAppId') ?: 'com.teno.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.6.0'
        testInstrumentationRunner project.findProperty('testRunner') ?: 'com.teno.app.RuntimeInstrumentation'
    }
    signingConfigs {
        if (tenoSigningFile.exists()) {
            internal {
                storeFile file(tenoSigning['storeFile'])
                storePassword tenoSigning['storePassword']
                keyAlias tenoSigning['keyAlias']
                keyPassword tenoSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (tenoSigningFile.exists()) signingConfig signingConfigs.internal
        }
    }
    testBuildType project.findProperty('testBuildType') ?: 'debug'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        // Historical UI remains in Git for traceability, outside the first-release APK.
        main.java.exclude '**/TeamActivity.java', '**/TeamAudioActivity.java', '**/TeamAudioUploadService.java', '**/JwdActivity.java'
        androidTest.java.srcDirs = ['src/crossPlatformTest/java']
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation project(':flutter')
    implementation 'androidx.core:core:1.17.0'
}
