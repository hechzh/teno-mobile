    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}
rootProject.name = 'Teno'
include ':app'
apply from: 'shared-ui/.android/include_flutter.groovy'
