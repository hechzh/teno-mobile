name: Teno iOS Xcode 14 compatibility
on:
  push:
    branches: [fix/teno-ios-xcode1431]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  swift-58-syntax:
    runs-on: ubuntu-latest
    container: swift:5.8.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse native source with Swift 5.8.1
        run: |
          mkdir -p ios/build
          swiftc --version | tee ios/build/swift-58-version.txt
          swiftc --version | grep 'Swift version 5.8.1'
          find ios/Teno ios/Tests -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse -swift-version 5
          printf 'Swift 5.8.1 syntax parsing passed. UIKit SDK type checking and Xcode 14.3.1 linking require recipient validation.\n' > ios/build/swift-58-syntax.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Teno-iOS-Swift58-syntax
          path: ios/build/swift-58-*.txt
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan source and history
        run: python3 scripts/secret_audit.py --history
      - name: Read iOS identity
        id: identity
        run: python3 scripts/ios_metadata.py >> "$GITHUB_OUTPUT"
      - name: Reuse unchanged shared UI frameworks from verified build16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44370291370 --repo hechzh/teno-mobile --name Teno-iOS --dir /tmp/teno-ios-build16
          source_zip=$(find /tmp/teno-ios-build16 -name Teno-iOS-1.2.0-build16-Xcode.zip -print -quit)
          test -n "$source_zip"
          python3 scripts/reuse_ios_frameworks.py "$source_zip" --sha256 5221605437c729093b6630671d3470f00e2fe75126eb63371601e5f79145480f
      - name: Generate portable Xcode 14 project
        run: |
          brew install xcodegen
          test "$(xcodegen version)" = 'Version: 2.46.0'
          python3 scripts/package_ios_xcode.py --frameworks ios/build/frameworks
          python3 scripts/package_ios_xcode.py --archive ios/build/handoff/${{ steps.identity.outputs.source_name }}
          python3 -m zipfile -e ios/build/handoff/${{ steps.identity.outputs.source_name }}.zip /tmp/teno-xcode-relocated
          python3 scripts/ios_project_compatibility.py /tmp/teno-xcode-relocated/${{ steps.identity.outputs.source_name }}/ios/Teno.xcodeproj/project.pbxproj > ios/build/project-compatibility.json
          /bin/bash -n /tmp/teno-xcode-relocated/${{ steps.identity.outputs.source_name }}/ios/Verify-Xcode.command
      - name: Read project with Xcode 14 era parser
        run: |
          gem install --user-install xcodeproj --version 1.22.0 --no-document
          ruby -e 'gem "xcodeproj", "1.22.0"; require "xcodeproj"; p = Xcodeproj::Project.open(ARGV[0]); abort "wrong format" unless p.object_version == "56" && p.root_object.compatibility_version == "Xcode 14.0"; abort "missing targets" unless p.targets.map(&:name).sort == %w[JwdVtrSDK Teno TenoTests]; puts "Xcodeproj 1.22.0: all three targets parsed in format 56"' /tmp/teno-xcode-relocated/${{ steps.identity.outputs.source_name }}/ios/Teno.xcodeproj | tee ios/build/legacy-project-parser.txt
      - name: Compile unsigned iPhone build with current CI Xcode
        run: |
          xcodebuild -version > ios/build/ci-xcode-version.txt
          python3 scripts/run_ios_xcode_checks.py device
          mkdir -p ios/build/Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/Teno.app ios/build/Payload/
          cd ios/build
          zip -qr "${{ steps.identity.outputs.ipa_name }}" Payload
      - name: Compile old SDK calendar branch separately
        run: |
          xcodebuild -project /tmp/teno-xcode-relocated/${{ steps.identity.outputs.source_name }}/ios/Teno.xcodeproj -scheme Teno -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/LegacyDerivedData CODE_SIGNING_ALLOWED=NO 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) TENO_LEGACY_CALENDAR_CHECK' build > ios-legacy-calendar-build.log 2>&1 || { tail -100 ios-legacy-calendar-build.log; exit 1; }
      - name: Run native regressions and simulator login
        timeout-minutes: 25
        run: python3 scripts/run_ios_xcode_checks.py simulator
      - name: Scan delivered files
        run: |
          python3 scripts/secret_audit.py --artifact ios/build/handoff/${{ steps.identity.outputs.source_name }}.zip
          python3 scripts/secret_audit.py --artifact ios/build/${{ steps.identity.outputs.ipa_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Teno-iOS
          path: |
            ios/build/${{ steps.identity.outputs.ipa_name }}
            ios/build/handoff/*.zip
            ios/build/screenshots
            ios/build/TestResults.xcresult
            ios/build/project-compatibility.json
            ios/build/legacy-project-parser.txt
            ios/build/ci-xcode-version.txt
            ios/build/frameworks/reuse-evidence.json
            ios/build/simulator-*.json
            ios-*.log
