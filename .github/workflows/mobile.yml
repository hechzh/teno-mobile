name: Teno mobile
on:
  push:
    branches: [main, "refactor/**", "feature/teno-0.6.0-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Scan source and full history
        run: python3 scripts/secret_audit.py --history
      - name: Read Android version
        id: release
        run: python3 scripts/ci_metadata.py >> "$GITHUB_OUTPUT"
      - name: Shared dependencies, generated contract, analysis and tests
        id: shared
        working-directory: shared-ui
        run: |
          flutter pub get --enforce-lockfile
          dart run pigeon --input pigeons/runtime.dart
          dart format lib/platform/runtime.g.dart
          git diff --exit-code -- lib/platform/runtime.g.dart ../app/src/main/java/com/teno/app/RuntimeMessages.java ../ios/Teno/Generated/RuntimeMessages.g.swift
          flutter analyze --no-pub
          TENO_PERSONAL_SCREENSHOTS="$GITHUB_WORKSPACE/design-baseline/v0.6.0/screenshots/android" flutter test --no-pub
      - name: Android build and lint
        id: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease --console=plain
          python3 scripts/secret_audit.py --artifact app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Teno-Android-CI-${{ steps.release.outputs.version }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/lint-results-release.html
            design-baseline/v0.6.0/screenshots/android
      - name: Report Android development result
        if: always() && github.event_name != 'pull_request' && github.repository == 'hechzh/teno-mobile'
        env:
          TENO_DEVELOPMENT_TOKEN: ${{ secrets.TENO_DEVELOPMENT_TOKEN }}
          TENO_DEVELOPMENT_STEPS: '{"shared":"${{ steps.shared.outcome }}","android":"${{ steps.android.outcome }}"}'
          TENO_JOB_STATUS: ${{ job.status }}
        run: python3 scripts/report_development.py --ci android --status "$TENO_JOB_STATUS" --outbox development-outbox
      - name: Preserve reporting receipt for retry
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Teno-Android-reporting-receipt
          path: development-outbox
  ios:
    # 0.6.0 is Android-only. The previously confirmed iOS branch stays independent.
    if: github.ref == 'refs/heads/refactor/teno-cross-platform'
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Prepare native host
        run: |
          brew install xcodegen
          test "$(xcodegen version)" = "Version: 2.46.0"
          cd shared-ui
          flutter pub get --enforce-lockfile
          flutter build swift-package --platform ios --no-codesign
          cd ../ios
          xcodegen generate
      - name: Compile and test iOS Simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/Teno.xcodeproj -scheme Teno -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/DerivedData -resultBundlePath ios/build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test > ios-build.log 2>&1 || { tail -200 ios-build.log; exit 1; }
          mkdir -p ios/build/screenshots
          # XCTest can use a temporary clone and leave the selected device shut down.
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/DerivedData/Build/Products/Debug-iphonesimulator/Teno.app
          xcrun simctl launch "$DEVICE" com.teno.app
          swift scripts/capture_ios.swift "$DEVICE" ios/build/screenshots/01-login.png
      - name: Build unsigned iPhone IPA
        id: device
        run: |
          xcodebuild -project ios/Teno.xcodeproj -scheme Teno -configuration Release -destination "generic/platform=iOS" -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build > ios-release.log 2>&1 || { tail -200 ios-release.log; exit 1; }
          mkdir -p ios/build/Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/Teno.app ios/build/Payload/
          cd ios/build
          zip -qr Teno-0.5.0-unsigned.ipa Payload
      - name: Scan unsigned IPA
        run: python3 scripts/secret_audit.py --artifact ios/build/Teno-0.5.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Teno-iOS
          path: |
            ios/build/Teno-0.5.0-unsigned.ipa
            ios/build/screenshots
            ios/build/TestResults.xcresult
            ios/Teno.xcodeproj
            ios-build.log
            ios-release.log
      - name: Report iOS development result
        if: always() && github.event_name != 'pull_request' && github.repository == 'hechzh/teno-mobile'
        env:
          TENO_DEVELOPMENT_TOKEN: ${{ secrets.TENO_DEVELOPMENT_TOKEN }}
          TENO_DEVELOPMENT_STEPS: '{"simulator":"${{ steps.simulator.outcome }}","device":"${{ steps.device.outcome }}"}'
          TENO_JOB_STATUS: ${{ job.status }}
        run: python3 scripts/report_development.py --ci ios --status "$TENO_JOB_STATUS" --outbox development-outbox
      - name: Preserve reporting receipt for retry
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Teno-iOS-reporting-receipt
          path: development-outbox
