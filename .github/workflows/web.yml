name: Teno Web preview
on:
  push:
    branches: ["feature/teno-web-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Scan source and history
        run: python3 scripts/secret_audit.py --history
      - name: Browser runtime contracts
        run: node --test web-client/test/runtime.test.cjs
      - name: Shared UI regression
        working-directory: shared-ui
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Web release
        working-directory: web-client
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter build web --release --base-href /app/ --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: Teno-Web-${{ github.sha }}
          path: web-client/build/web
