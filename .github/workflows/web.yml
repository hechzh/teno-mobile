name: Teno Web
on:
  push:
    branches: ["feature/teno-web-*"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Scan source and history
        run: python3 scripts/secret_audit.py --history
      - name: Browser runtime contracts
        run: node --test web-client/test/*.test.cjs
      - name: Immutable startup assets
        run: python3 -m unittest discover -s web-client/test -p "test_*.py"
      - name: Shared UI regression
        working-directory: shared-ui
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Web analysis
        working-directory: web-client
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
      - name: Package Web from this Android source commit
        run: python3 web-client/scripts/package.py --base-href /app-preview/
      - uses: actions/upload-artifact@v4
        with:
          name: Teno-Web-${{ github.sha }}
          path: dist/Teno-Web-*
          if-no-files-found: error
