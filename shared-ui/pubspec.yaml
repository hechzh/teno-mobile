name: teno_mobile
description: Shared Teno mobile interface backed by platform recording runtimes.
publish_to: none
version: 0.6.2+13
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 29.1.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
  module:
    androidX: true
    androidPackage: com.teno.shared
    iosBundleIdentifier: com.teno.shared
